[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gwy-photo-mac"
version = "0.1.0"
description = "国考照片处理工具 macOS 版：基于 Windows 工具原理的非官方本地复现"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
authors = [{name = "shoal-rat"}]
dependencies = ["Pillow>=11,<13", "numpy>=2,<3", "opencv-python-headless==4.11.0.86"]

[project.optional-dependencies]
gui = ["PySide6-Essentials==6.10.3"]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.12,<1", "build>=1,<2"]
bundle = ["pyinstaller==6.22.3"]

[project.scripts]
gwy-photo = "gwy_photo_mac.cli:main"

[project.gui-scripts]
gwy-photo-gui = "gwy_photo_mac.gui:main"

[project.urls]
Homepage = "https://github.com/shoal-rat/gwy-photo-mac"
Issues = "https://github.com/shoal-rat/gwy-photo-mac/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gwy_photo_mac = ["data/*.xml", "data/*.ini", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

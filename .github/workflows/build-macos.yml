name: Build macOS apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[gui,dev,bundle]'
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python scripts/build_macos.py
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.runner }}
          path: |
            dist/*.zip
            dist/*.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: macOS-*
          merge-multiple: true
      - name: Publish app archives with compatibility notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --title "$GITHUB_REF_NAME · 国考照片处理工具 macOS 版" --notes-file docs/RELEASE_NOTES.md
